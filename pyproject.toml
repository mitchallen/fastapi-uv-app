[project]
name = "fastapi-app"
version = "0.1.0"
description = "A simple FastAPI app"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic",
    "slowapi",
]

# Test, docs and scan tooling. `uv sync` installs it by default; the
# Dockerfile's `--no-dev` keeps it out of the image (pip-audit alone pulls
# pip, which vendors packages Trivy flags).
[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "httpx",
    "pytest-cov",
    "pdoc",
    "pip-audit",
    "bandit",
]