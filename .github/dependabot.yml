version: 2
# Keeps the app, its image and its workflows patched. This repo was found on
# 2026-10-22 carrying 25 open alerts (one critical) in a lockfile untouched
# since Nov 2025: security alerts alone never fix anything, they only report.
#
# Noise control: each ecosystem batches its minor+patch bumps into one grouped
# PR, and `cooldown` skips releases younger than 7 days, so fast-moving deps
# land as one bump to the latest instead of a PR per release. Majors stay out
# of the groups and arrive as individual PRs. Cooldown does not delay security
# updates. Nothing auto-merges here — review and merge the PRs by hand.
updates:
  # Python dependencies (pyproject.toml / uv.lock). Must be `uv`, not `pip`:
  # the pip ecosystem does not read uv.lock, so its PRs never open.
  - package-ecosystem: uv
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      python-minor-patch:
        update-types: ["minor", "patch"]
    commit-message:
      prefix: "deps"

  # Base image in the Dockerfile (python:3.12-slim). Dependabot treats a
  # Python bump such as 3.12 -> 3.13 as a *minor*, so it arrives in the grouped
  # PR; check the release schedule before taking one. The uv binary is copied
  # from ghcr.io/astral-sh/uv:latest, which has no version for Dependabot to
  # track and is refreshed on every build anyway.
  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      docker-minor-patch:
        update-types: ["minor", "patch"]
    commit-message:
      prefix: "docker"

  # Actions used by the workflows (incl. the trivy-action pin).
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions-minor-patch:
        update-types: ["minor", "patch"]
    commit-message:
      prefix: "ci"
