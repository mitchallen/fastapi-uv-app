name: CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.15'  # match the image: cgr.dev/chainguard/python:latest
    - name: Install uv
      run: curl -LsSf https://astral.sh/uv/install.sh | sh
    - name: Install dependencies
      run: uv sync
    - name: Run tests
      run: PYTHONPATH=. uv run pytest --cov=main --cov-report=term-missing
    - name: Run security scans
      run: make security

  docker:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
    - uses: actions/checkout@v7
    # PRs build the image as a check; only a push to main publishes :latest.
    - name: Log in to GitHub Container Registry
      if: github.event_name == 'push'
      run: echo ${{ secrets.GITHUB_TOKEN }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin
    - name: Build Docker image
      run: docker build -t ghcr.io/${{ github.repository }}/fastapi-app:latest .
    - name: Push Docker image
      if: github.event_name == 'push'
      run: docker push ghcr.io/${{ github.repository }}/fastapi-app:latest
